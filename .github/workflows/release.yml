name: Build and release AutoPresser

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: >-
          dotnet publish ./AutoPresser/AutoPresser.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readme = @'
          AutoPresser
          
          This is a self-contained Windows x64 build. Extract the ZIP and run AutoPresser.exe.
          No separate .NET desktop runtime installation should be required.
          
          Configuration is stored under %LOCALAPPDATA%\AutoPresser.
          '@
          Set-Content -Path ./artifacts/publish/README.txt -Value $readme -Encoding utf8
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/AutoPresser-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPresser-win-x64
          path: ./artifacts/AutoPresser-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoPresser ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/AutoPresser-win-x64.zip
